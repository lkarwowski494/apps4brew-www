<style>

:root{--ink:#222;--soft:#8a8a8a;--line:#d6d6d6;--bg:#fff;--note:#555}

<header>
<h1>E1 · kandydaci na metaforę strony apps4brew.com (szkice ideowe, 20.10.2026)</h1>
<p>Szare szkice, nie kierunki: pokazują przedmiot ze świata dziedziny i dane, które niesie. Pogrubiona ramka = wybór do rozwinięcia w E2; „rezerwa” = na wypadek odrzucenia. Opis i ryzyka: docs/design/01-swiat.md.</p>
</header>
